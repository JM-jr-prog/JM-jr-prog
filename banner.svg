<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05010d"/>
      <stop offset="60%" stop-color="#1a0630"/>
      <stop offset="100%" stop-color="#3b0a63"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9b3ff"/>
      <stop offset="50%" stop-color="#b44cff"/>
      <stop offset="100%" stop-color="#7a1fd1"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7a8ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="900" height="300" rx="20"/></clipPath>
    <clipPath id="sunclip"><rect x="0" y="40" width="900" height="130"/></clipPath>
  </defs>
  <style>
    .star{fill:#fff;animation:tw 3s infinite ease-in-out}
    .d1{animation-delay:.8s}.d2{animation-delay:1.6s}.d3{animation-delay:2.3s}
    @keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
    .grid{animation:move 1.2s linear infinite}
    @keyframes move{from{transform:translateY(0)}to{transform:translateY(24px)}}
    .blink{animation:bl 1s steps(2) infinite}
    @keyframes bl{50%{opacity:0}}
    .pulse{animation:pu 4s ease-in-out infinite}
    @keyframes pu{0%,100%{opacity:.85}50%{opacity:1}}
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#sky)"/>

    <!-- stars -->
    <circle class="star" cx="70" cy="40" r="1.5"/>
    <circle class="star d1" cx="160" cy="95" r="1"/>
    <circle class="star d2" cx="260" cy="30" r="1.5"/>
    <circle class="star d3" cx="340" cy="75" r="1"/>
    <circle class="star" cx="560" cy="35" r="1.5"/>
    <circle class="star d2" cx="640" cy="90" r="1"/>
    <circle class="star d1" cx="740" cy="45" r="1.5"/>
    <circle class="star d3" cx="835" cy="85" r="1"/>
    <circle class="star d2" cx="450" cy="22" r="1"/>

    <!-- sun with scanline cuts -->
    <g clip-path="url(#sunclip)" class="pulse">
      <circle cx="450" cy="150" r="100" fill="url(#sun)" filter="url(#glow)"/>
      <rect x="340" y="118" width="220" height="3" fill="#05010d"/>
      <rect x="340" y="132" width="220" height="5" fill="#05010d"/>
      <rect x="340" y="148" width="220" height="7" fill="#05010d"/>
    </g>

    <!-- ground -->
    <rect x="0" y="170" width="900" height="130" fill="#0a0216"/>
    <line x1="0" y1="170" x2="900" y2="170" stroke="#e070ff" stroke-width="2" filter="url(#glow)"/>

    <!-- perspective grid -->
    <g stroke="#b44cff" stroke-opacity=".55" stroke-width="1">
      <line x1="450" y1="170" x2="-300" y2="300"/>
      <line x1="450" y1="170" x2="-80" y2="300"/>
      <line x1="450" y1="170" x2="130" y2="300"/>
      <line x1="450" y1="170" x2="300" y2="300"/>
      <line x1="450" y1="170" x2="450" y2="300"/>
      <line x1="450" y1="170" x2="600" y2="300"/>
      <line x1="450" y1="170" x2="770" y2="300"/>
      <line x1="450" y1="170" x2="980" y2="300"/>
      <line x1="450" y1="170" x2="1200" y2="300"/>
    </g>
    <g class="grid" stroke="#b44cff" stroke-opacity=".55" stroke-width="1">
      <line x1="0" y1="176" x2="900" y2="176"/>
      <line x1="0" y1="184" x2="900" y2="184"/>
      <line x1="0" y1="196" x2="900" y2="196"/>
      <line x1="0" y1="212" x2="900" y2="212"/>
      <line x1="0" y1="234" x2="900" y2="234"/>
      <line x1="0" y1="262" x2="900" y2="262"/>
    </g>
    <!-- mask so grid lines never overlap the title area -->
    <rect x="0" y="170" width="900" height="130" fill="url(#sky)" opacity="0"/>

    <!-- title -->
    <text x="450" y="128" text-anchor="middle" font-family="Courier New, monospace"
          font-weight="bold" font-size="58" letter-spacing="4" fill="url(#title)"
          stroke="#ff5ce1" stroke-width="1" stroke-opacity=".6"
          filter="url(#glow)">YOUR NAME</text>
    <rect x="270" y="196" width="360" height="40" rx="6" fill="#05010d" opacity=".78"/>
    <text x="450" y="222" text-anchor="middle" font-family="Courier New, monospace"
          font-size="17" letter-spacing="3" fill="#e9b3ff">&gt; CS STUDENT · BUILDING IN PUBLIC<tspan class="blink" fill="#ff5ce1">_</tspan></text>
  </g>
  <rect x="1" y="1" width="898" height="298" rx="20" fill="none" stroke="#b44cff" stroke-width="2" filter="url(#glow)"/>
</svg>
